services:
  tabletop:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PUBLIC_ORIGINS: "${PUBLIC_ORIGINS:-}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
